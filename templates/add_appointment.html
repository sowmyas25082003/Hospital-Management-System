<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/form.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <h2>Book Appointment</h2>

    <form action="{{ url_for('add_appointment') }}" method="POST">

        <!-- Patient Name -->

        <div class="row">

            <div class="input-box">

                <label>Patient Name</label>

                <input
                    type="text"
                    name="patient_name"
                    placeholder="Enter Patient Name"
                    required>

            </div>

        </div>


        <!-- Department -->

        <div class="row">

            <div class="input-box">

                <label>Department</label>

                <select
                    name="department"
                    id="department"
                    required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="Cardiology">
                        Cardiology
                    </option>

                    <option value="Neurology">
                        Neurology
                    </option>

                    <option value="Orthopedics">
                        Orthopedics
                    </option>

                    <option value="Pediatrics">
                        Pediatrics
                    </option>

                    <option value="General medicine">
                        General Medicine
                    </option>

                </select>

            </div>

        </div>

        <!-- Patient Details -->

<div class="row">

    <div class="input-box">

        <label>Age</label>

        <input
            type="number"
            name="age"
            placeholder="Enter Age"
            min="1"
            max="120"
            required>

    </div>

    <div class="input-box">

        <label>Gender</label>

        <select name="gender" required>

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>

</div>


<div class="row">

    <div class="input-box">

        <label>Phone Number</label>

        <input
            type="tel"
            name="phone"
            placeholder="Enter Phone Number"
            maxlength="15"
            required>

    </div>

    <div class="input-box">

        <label>Address</label>

        <input
            type="text"
            name="address"
            placeholder="Enter Address"
            required>

    </div>

</div>



        <!-- Date and Time -->

        <div class="row">

            <div class="input-box">

                <label>Appointment Date</label>

                <input
                    type="date"
                    name="appointment_date"
                    required>

            </div>

            <div class="input-box">

                <label>Appointment Time</label>

                <input
                    type="time"
                    name="appointment_time"
                    required>

            </div>

        </div>


        <!-----save------>

        <button type="submit">

            <i class="fa-solid fa-user-doctor"></i>

            Continue to Select Doctor

        </button>

        <a href="javascript:history.back()" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>

    </form>

</div>




</body>

</html>
