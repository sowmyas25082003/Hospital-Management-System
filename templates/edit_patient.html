```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Patient</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/form.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <h2>Edit Patient</h2>

    <form
        action="{{ url_for(
            'edit_patient',
            patient_id=patient.patient_id
        ) }}"
        method="POST"
    >

        <div class="row">

            <div class="input-box">

                <label>Patient Name</label>

                <input
                    type="text"
                    name="patient_name"
                    value="{{ patient.patient_name }}"
                    placeholder="Enter Patient Name"
                    required>

            </div>


            <div class="input-box">

                <label>Age</label>

                <input
                    type="number"
                    name="age"
                    value="{{ patient.age }}"
                    placeholder="Enter Age"
                    required>

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Gender</label>

                <select name="gender" required>

                    <option value="Male"
                        {% if patient.gender == "Male" %}
                        selected
                        {% endif %}>
                        Male
                    </option>

                    <option value="Female"
                        {% if patient.gender == "Female" %}
                        selected
                        {% endif %}>
                        Female
                    </option>

                    <option value="Other"
                        {% if patient.gender == "Other" %}
                        selected
                        {% endif %}>
                        Other
                    </option>

                </select>

            </div>


            <div class="input-box">

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ patient.phone }}"
                    placeholder="Phone Number"
                    required>

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Address</label>

                <input
                    type="text"
                    name="address"
                    value="{{ patient.address }}"
                    placeholder="Address">

            </div>


            <div class="input-box">

                <label>Disease</label>

                <input
                    type="text"
                    name="disease"
                    value="{{ patient.disease }}"
                    placeholder="Disease"
                    required>

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Doctor Assigned</label>

                <input
                    type="text"
                    name="doctor_assigned"
                    value="{{ patient.doctor_assigned }}"
                    placeholder="Doctor Name">

            </div>


            <div class="input-box">

                <label>Status</label>

                <select name="status" required>

                    <option value="Admitted"
                        {% if patient.status == "Admitted" %}
                        selected
                        {% endif %}>
                        Admitted
                    </option>

                    <option value="Discharged"
                        {% if patient.status == "Discharged" %}
                        selected
                        {% endif %}>
                        Discharged
                    </option>

                </select>

            </div>

        </div>


        <button type="submit">

            <i class="fa-solid fa-pen-to-square"></i>

            Update Patient

        </button>

        <a href="javascript:history.back()" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>

    </form>

</div>

</body>

</html>
