
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/form.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Back Button -->
    <a href="javascript:history.back()" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Back
    </a>

    <h2>Edit Appointment</h2>

    <form
        action="{{ url_for(
            'edit_appointment',
            appointment_id=appointment.appointment_id
        ) }}"
        method="POST"
    >

        <!-- Patient Name + Age -->

        <div class="row">

            <div class="input-box">

                <label>Patient Name</label>

                <input
                    type="text"
                    name="patient_name"
                    value="{{ appointment.patient_name }}"
                    placeholder="Enter Patient Name"
                    required>

            </div>


            <div class="input-box">

                <label>Age</label>

                <input
                    type="number"
                    name="age"
                    value="{{ appointment.age }}"
                    placeholder="Enter Age"
                    required>

            </div>

        </div>


        <!-- Gender + Phone -->

        <div class="row">

            <div class="input-box">

                <label>Gender</label>

                <select name="gender" required>

                    <option value="Male"
                        {% if appointment.gender == "Male" %}
                        selected
                        {% endif %}>
                        Male
                    </option>

                    <option value="Female"
                        {% if appointment.gender == "Female" %}
                        selected
                        {% endif %}>
                        Female
                    </option>

                    <option value="Other"
                        {% if appointment.gender == "Other" %}
                        selected
                        {% endif %}>
                        Other
                    </option>

                </select>

            </div>


            <div class="input-box">

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ appointment.phone }}"
                    placeholder="Phone Number"
                    required>

            </div>

        </div>


        <!-- Department + Doctor -->

        <div class="row">

            <div class="input-box">

                <label>Department</label>

                <input
                    type="text"
                    name="department"
                    value="{{ appointment.department }}"
                    placeholder="Department"
                    required>

            </div>


            <div class="input-box">

                <label>Doctor Name</label>

                <input
                    type="text"
                    name="doctor_name"
                    value="{{ appointment.doctor_name }}"
                    placeholder="Doctor Name"
                    required>

            </div>

        </div>


        <!-- Date + Time -->

        <div class="row">

            <div class="input-box">

                <label>Appointment Date</label>

                <input
                    type="date"
                    name="appointment_date"
                    value="{{ appointment.appointment_date }}"
                    required>

            </div>


            <div class="input-box">

                <label>Appointment Time</label>

                <input
                    type="time"
                    name="appointment_time"
                    value="{{ appointment.appointment_time }}"
                    required>

            </div>

        </div>


        <!-- Address + Status -->

        <div class="row">

            <div class="input-box">

                <label>Address</label>

                <input
                    type="text"
                    name="address"
                    value="{{ appointment.address }}"
                    placeholder="Address">

            </div>


            <div class="input-box">

                <label>Status</label>

                <select name="status" required>

                    <option value="Pending"
                        {% if appointment.status == "Pending" %}
                        selected
                        {% endif %}>
                        Pending
                    </option>

                    <option value="Confirmed"
                        {% if appointment.status == "Confirmed" %}
                        selected
                        {% endif %}>
                        Confirmed
                    </option>

                    <option value="Completed"
                        {% if appointment.status == "Completed" %}
                        selected
                        {% endif %}>
                        Completed
                    </option>

                    <option value="Cancelled"
                        {% if appointment.status == "Cancelled" %}
                        selected
                        {% endif %}>
                        Cancelled
                    </option>

                </select>

            </div>

        </div>


        <!-- Update Button -->

        <button type="submit">

            <i class="fa-solid fa-pen-to-square"></i>

            Update Appointment

        </button>

        <a href="javascript:history.back()" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>

    </form>

</div>

</body>

</html>
