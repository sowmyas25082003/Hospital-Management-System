<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Doctor</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/form.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <h2>Edit Doctor</h2>

    <form
        action="{{ url_for(
            'edit_doctor',
            doctor_id=doctor.doctor_id
        ) }}"
        method="POST"
    >

        <div class="row">

            <div class="input-box">

                <label>Doctor Name</label>

                <input
                    type="text"
                    name="doctor_name"
                    value="{{ doctor.doctor_name }}"
                    placeholder="Enter Doctor Name"
                    required>

            </div>


            <div class="input-box">

                <label>Specialization</label>

                <input
                    type="text"
                    name="specialization"
                    value="{{ doctor.specialization }}"
                    placeholder="Enter Specialization"
                    required>

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Qualification</label>

                <input
                    type="text"
                    name="qualification"
                    value="{{ doctor.qualification }}"
                    placeholder="Enter Qualification"
                    required>

            </div>


            <div class="input-box">

                <label>Experience</label>

                <input
                    type="number"
                    name="experience"
                    value="{{ doctor.experience }}"
                    placeholder="Years of Experience"
                    required>

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ doctor.phone }}"
                    placeholder="Phone Number"
                    required>

            </div>


            <div class="input-box">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ doctor.email }}"
                    placeholder="Email Address"
                    required>

            </div>

        </div>


        <div class="row">

            <div class="input-box">

                <label>Department</label>

                <select name="department" required>

                    <option value="Cardiology"
                        {% if doctor.department == "Cardiology" %}
                        selected
                        {% endif %}>
                        Cardiology
                    </option>

                    <option value="Neurology"
                        {% if doctor.department == "Neurology" %}
                        selected
                        {% endif %}>
                        Neurology
                    </option>

                    <option value="Orthopedics"
                        {% if doctor.department == "Orthopedics" %}
                        selected
                        {% endif %}>
                        Orthopedics
                    </option>

                    <option value="Pediatrics"
                        {% if doctor.department == "Pediatrics" %}
                        selected
                        {% endif %}>
                        Pediatrics
                    </option>

                    <option value="General Medicine"
                        {% if doctor.department == "General Medicine" %}
                        selected
                        {% endif %}>
                        General Medicine
                    </option>

                </select>

            </div>


            <div class="input-box">

                <label>Status</label>

                <select name="status" required>

                    <option value="Available"
                        {% if doctor.status == "Available" %}
                        selected
                        {% endif %}>
                        Available
                    </option>

                    <option value="Not Available"
                        {% if doctor.status == "Not Available" %}
                        selected
                        {% endif %}>
                        Not Available
                    </option>

                </select>

            </div>

        </div>


        <button type="submit">

            <i class="fa-solid fa-pen-to-square"></i>

            Update Doctor

        </button>

        <a href="javascript:history.back()" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </a>

    </form>

</div>

</body>

</html>
