<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Bill</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/form.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>


<body>


<div class="container">


<h2>Create Bill</h2>


<form action="{{ url_for('add_bill') }}" method="POST">


<div class="row">

<div class="input-box">

<label>Patient Name</label>

<input type="text" name="patient_name" required>

</div>


<div class="input-box">

<label>Doctor Name</label>

<input type="text" name="doctor_name" required>

</div>

</div>



<div class="row">


<div class="input-box">

<label>Consultation Fee</label>

<input type="number" name="consultation_fee" required>

</div>


<div class="input-box">

<label>Medicine Fee</label>

<input type="number" name="medicine_fee" required>

</div>


</div>




<div class="row">


<div class="input-box">

<label>Lab Fee</label>

<input type="number" name="lab_fee" required>

</div>


<div class="input-box">

<label>Bill Date</label>

<input type="date" name="bill_date" required>

</div>


</div>




<div class="row">


<div class="input-box">

<label>Payment Status</label>


<select name="payment_status">


<option value="Paid">
Paid
</option>


<option value="Pending">
Pending
</option>


</select>


</div>


</div>



<button type="submit">

<i class="fa-solid fa-file-invoice-dollar"></i>

Create Bill

</button>

<a href="javascript:history.back()" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Back
    </a>



</form>


</div>


</body>


</html>
