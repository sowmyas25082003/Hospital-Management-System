<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/form.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="container">

        <h2>Patient Registration</h2>

        <form action="{{ url_for('add_patient') }}" method="POST">

            <div class="row">

                <div class="input-box">
                    <label>Patient Name</label>
                    <input type="text"
                        name="patient_name"
                        placeholder="Enter Name"
                        required>
                </div>

                <div class="input-box">
                    <label>Age</label>
                    <input type="number"
                        name="age"
                        placeholder="Enter Age"
                        required>
                </div>

            </div>

            <div class="row">

                <div class="input-box">
                    <label>Gender</label>

                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>

                </div>

                <div class="input-box">
                    <label>Phone</label>
                    <input type="text"
                        name="phone"
                        placeholder="Phone Number"
                        required>
                </div>

            </div>

            <div class="row">

                <div class="input-box">
                    <label>Address</label>
                    <input type="text"
                        name="address"
                        placeholder="Address"
                        required>
                </div>

                <div class="input-box">
                    <label>Disease</label>
                    <input type="text"
                        name="disease"
                        placeholder="Disease"
                        required>
                </div>

            </div>

            <div class="row">

                <div class="input-box">
                    <label>Doctor Assigned</label>
                    <input type="text"
                        name="doctor_assigned"
                        placeholder="Doctor Name"
                        required>
                </div>

                <div class="input-box">
                    <label>Status</label>

                    <select name="status" required>
                        <option value="">Select Status</option>
                        <option value="Admitted">Admitted</option>
                        <option value="Discharged">Discharged</option>
                    </select>

                </div>

            </div>

            <button type="submit">
                <i class="fa-solid fa-floppy-disk"></i>
                Save Patient
            </button>

            <a href="javascript:history.back()" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </a>

        </form>

    </div>

</body>

</html>
